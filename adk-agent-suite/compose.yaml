services:
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://suite:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/suite
      SESSION_DATABASE_URL: postgresql+psycopg://suite:${POSTGRES_PASSWORD}@postgres:5432/sessions
      REVIEW_TEST_MODE: skip
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [suite-data:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: suite
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-postgres.sql:/docker-entrypoint-initdb.d/01-sessions.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U suite -d suite"]
      interval: 5s
      retries: 10
volumes:
  suite-data:
  postgres-data:
