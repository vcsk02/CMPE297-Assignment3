name: Test all five agents
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.12.23", python-version: "3.12"}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest -q --junitxml=artifacts/test-results.xml
      - run: uv run --frozen agent-suite demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-evidence
          path: |
            artifacts/**/*.json
            artifacts/**/*.xml
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: suite
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: suite_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U suite -d suite_test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.12.23", python-version: "3.12"}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q tests/test_commerce.py tests/test_boundaries.py
        env:
          TEST_DATABASE_URL: postgresql://suite:ci-only-password@localhost:5432/suite_test
