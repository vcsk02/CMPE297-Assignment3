# Current flat resource format for MCP Toolbox 1.x; deploy behind authenticated ingress.
# Catalog reads only. Transactional writes remain in the application service.
kind: source
name: shop_catalog
type: postgres
host: ${PGHOST}
port: 5432
database: ${PGDATABASE}
user: ${PGUSER}
password: ${PGPASSWORD}
---
kind: tool
name: catalog_search
type: postgres-sql
source: shop_catalog
description: Search sports products by literal text with a maximum price in integer USD cents.
parameters:
  - name: query
    type: string
    description: Product name or category substring, at most 100 characters.
  - name: max_price_cents
    type: integer
    description: Maximum unit price in USD cents, from 1 to 10000000.
statement: |
  SELECT id, name, category, price_cents, stock
  FROM products
  WHERE length($1) <= 100 AND $2 BETWEEN 1 AND 10000000
    AND price_cents <= $2
    AND (strpos(lower(name), lower($1)) > 0 OR strpos(lower(category), lower($1)) > 0)
  ORDER BY price_cents, id
  LIMIT 20;
---
kind: toolset
name: catalog
tools:
  - catalog_search
